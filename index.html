<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge-AI Acoustic Event Detection - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            text-align: center;
        }
        .login-container p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--neon-blue);
            font-family: var(--font-heading);
            letter-spacing: 1px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-main);
            font-family: var(--font-body);
            outline: none;
            transition: all 0.3s;
        }
        .form-group input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px rgba(188, 19, 254, 0.3);
        }
        .login-btn-submit {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: var(--neon-blue);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }
        .login-btn-submit:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 25px rgba(188, 19, 254, 0.6);
            color: #fff;
        }
        .auth-notice {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--glass-border);
            padding-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Acoustic<span>Edge</span></div>
    </nav>

    <div class="login-wrapper">
        <div class="glass-card login-container">
            <h2 class="glitch-text" style="font-size: 1.8rem; margin-bottom: 5px;">SYSTEM LOGIN</h2>
            <p>Authorized Personnel Only</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">NODE ID / USERNAME</label>
                    <input type="text" id="username" placeholder="Enter assigned ID" required>
                </div>
                <div class="form-group">
                    <label for="password">ACCESS KEY</label>
                    <input type="password" id="password" placeholder="Enter secure key" required>
                </div>
                <button type="submit" class="login-btn-submit">INITIALIZE CONNECTION</button>
            </form>

            <div class="auth-notice">
                System access is restricted to pre-configured IoT network administrators. Please use the administrative credentials provided with your hardware system.
            </div>
        </div>
    </div>

    <script>
        // Auto-redirect if already logged in
        if (sessionStorage.getItem('isAuthenticated') === 'true') {
            window.location.href = 'home.html';
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            // Dummy authentication for demonstration
            if(user === 'admin' && pass === 'admin123') {
                sessionStorage.setItem('isAuthenticated', 'true');
                window.location.href = 'home.html';
            } else {
                alert('Access Denied: Invalid Credentials. Please check the credentials provided with your system.');
            }
        });
    </script>
</body>
</html>
